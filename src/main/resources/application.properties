# server
spring.application.name=virtualcard
server.port=8085
spring.profiles.active=dev
spring.liquibase.contexts=dev

# database
spring.datasource.url=jdbc:mariadb://localhost:3306/virtualcard?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Europe/Lisbon
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# doc
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# logging
logging.file.name=logs/virtualcard.log
logging.level.root=INFO
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.file-name-pattern=logs/virtualcard.%d{yyyy-MM-dd}.%i.log

# monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# throttling
app.rate-limit.requests=100
app.rate-limit.window-seconds=60
app.rate-limit.enabled=true