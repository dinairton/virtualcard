databaseChangeLog:
  - preConditions:
      - runningAs:
          username: root
  - changeSet:
      id: 1.0.0
      author: dinairton.rodrigues
      labels: table of transactions
      changes:
        - createTable:
            tableName: transaction
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: virtual_card_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: tinyint
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: tinyint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transaction
            baseColumnNames: virtual_card_id
            referencedTableName: virtual_card
            referencedColumnNames: id
            constraintName: fk_transcation_virtual_card