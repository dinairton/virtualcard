databaseChangeLog:
  - preConditions:
      - runningAs:
          username: root
      - dbms:
          type: mariadb
  - changeSet:
      id: 1.0.2
      author: dinairton.rodrigues
      labels: table of idempotency
      changes:
        - createTable:
            tableName: idem_potency
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: idem_potency_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: response
                  type: longtext
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: tinyint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
