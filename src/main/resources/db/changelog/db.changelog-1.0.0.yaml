databaseChangeLog:
  - preConditions:
      - runningAs:
          username: root
  - changeSet:
      id: 1.0.0
      author: dinairton.rodrigues
      labels: table of virtual cards
      changes:
        - createTable:
            tableName: virtual_card
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: card_holder_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: statue
                  type: tinyint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
